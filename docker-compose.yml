services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mizanflow
      POSTGRES_USER: mizanflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U mizanflow"], interval: 5s, retries: 10 }
  backend:
    build: ./backend
    depends_on: { db: { condition: service_healthy } }
    environment:
      DB_URL: jdbc:postgresql://db:5432/mizanflow
      DB_USER: mizanflow
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis (>=32 caractères)}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8081:80"]
volumes:
  pgdata:
